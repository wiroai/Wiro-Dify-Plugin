identity:
  author: wiroai
  name: wiro_media
  label:
    en_US: Wiro AI Media
  description:
    en_US: Generate and edit images, make videos, talking avatars, speech, music and 3D models, transcribe audio, run any of the 1,000+ models on Wiro AI, your saved workflows, Studio and your agents. Results come back as files.
  icon: icon.png
  tags:
    - image
    - videos
credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: API Key
    placeholder:
      en_US: Enter the API key of your Wiro AI project
    help:
      en_US: Create a project on Wiro AI to get an API key.
    url: https://wiro.ai/panel/project/new
  api_secret:
    type: secret-input
    required: false
    label:
      en_US: API Secret
    placeholder:
      en_US: Only for projects that use signature authentication
    help:
      en_US: Projects with signature authentication sign each request with this secret. It is never sent.
tools:
  - tools/generate_image.yaml
  - tools/edit_image.yaml
  - tools/upscale_image.yaml
  - tools/remove_background.yaml
  - tools/generate_video.yaml
  - tools/image_to_video.yaml
  - tools/lipsync.yaml
  - tools/text_to_speech.yaml
  - tools/speech_to_text.yaml
  - tools/generate_music.yaml
  - tools/generate_3d.yaml
  - tools/run_model.yaml
  - tools/run_workflow.yaml
  - tools/ask_studio.yaml
  - tools/message_agent.yaml
  - tools/get_task.yaml
  - tools/search_models.yaml
  - tools/get_model.yaml
extra:
  python:
    source: provider/wiro_media.py
