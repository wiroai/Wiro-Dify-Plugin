identity:
  author: wiroai
  name: wiro_media
  label:
    en_US: Wiro AI Media
  description:
    en_US: Generate images, videos, speech and music with models on Wiro AI, or run any of its 1,000+ models by ID. Results come back as files.
  icon: icon.png
  tags:
    - image
    - videos
credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: API Key
    placeholder:
      en_US: Enter the API key of your Wiro AI project
    help:
      en_US: Create a project on Wiro AI to get an API key.
    url: https://wiro.ai/panel/project/new
  api_secret:
    type: secret-input
    required: false
    label:
      en_US: API Secret
    placeholder:
      en_US: Only for projects that use signature authentication
    help:
      en_US: Projects with signature authentication sign each request with this secret. It is never sent.
tools:
  - tools/generate_image.yaml
  - tools/generate_video.yaml
  - tools/text_to_speech.yaml
  - tools/generate_music.yaml
  - tools/run_model.yaml
  - tools/get_task.yaml
  - tools/search_models.yaml
  - tools/get_model.yaml
extra:
  python:
    source: provider/wiro_media.py
