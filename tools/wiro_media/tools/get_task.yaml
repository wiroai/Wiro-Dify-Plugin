identity:
  name: get_task
  author: wiroai
  label:
    en_US: Get Task Result
description:
  human:
    en_US: Collect the files of a Wiro AI task or workflow run that was still running when another tool returned, or check its status.
  llm: Returns the result files or text of a Wiro AI task or workflow run by its token or task ID, waiting a little if it is still running.
parameters:
  - name: task
    type: string
    required: true
    form: llm
    label:
      en_US: Task token or ID
    human_description:
      en_US: The task token, workflow run token or task ID that a Wiro AI tool returned.
    llm_description: The task token or numeric task ID returned by an earlier Wiro AI tool call.
  - name: wait_seconds
    type: number
    required: false
    form: form
    default: 60
    min: 0
    max: 480
    label:
      en_US: Wait up to (seconds)
    human_description:
      en_US: How long to wait if the task is still running.
extra:
  python:
    source: tools/get_task.py
