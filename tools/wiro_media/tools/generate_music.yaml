identity:
  name: generate_music
  author: wiroai
  label:
    en_US: Generate Music
description:
  human:
    en_US: Create music or sound effects from a description with an audio model on Wiro AI. The audio comes back as a file.
  llm: Creates music or a sound effect from a text description and returns the audio file.
parameters:
  - name: prompt
    type: string
    required: true
    form: llm
    label:
      en_US: Prompt
    human_description:
      en_US: Describe the style, mood, instruments or sound.
    llm_description: A description of the music or sound to create.
  - name: duration
    type: number
    required: false
    form: llm
    min: 1
    max: 600
    label:
      en_US: Duration (seconds)
    human_description:
      en_US: Optional. Used when the model offers this length.
    llm_description: Optional length of the audio in seconds.
  - name: model
    type: dynamic-select
    required: false
    form: form
    default: elevenlabs/text-to-music-v2
    label:
      en_US: Model
    human_description:
      en_US: Music model on Wiro AI. The list comes live from the Wiro AI catalog, most used first.
  - name: extra_parameters
    type: string
    required: false
    form: form
    label:
      en_US: Extra parameters
    human_description:
      en_US: 'Optional JSON object with the model''s own parameters, for example {"instrumental": "true"}.'
extra:
  python:
    source: tools/generate_music.py
