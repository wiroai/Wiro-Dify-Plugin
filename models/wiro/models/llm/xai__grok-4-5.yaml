model: xai/grok-4-5
label:
  en_US: xai/grok-4-5
model_type: llm
features:
- tool-call
- multi-tool-call
- stream-tool-call
- agent-thought
- vision
- document
- structured-output
model_properties:
  mode: chat
  context_size: 500000
parameter_rules:
- name: temperature
  use_template: temperature
  max: 2.0
- name: top_p
  use_template: top_p
- name: max_tokens
  use_template: max_tokens
  default: 8192
  min: 1
  max: 65536
- name: reasoning_effort
  label:
    en_US: Reasoning effort
  type: string
  required: false
  options:
  - low
  - medium
  - high
  help:
    en_US: How much the model thinks before it answers. Lower is faster and uses fewer
      tokens.
- name: response_format
  label:
    en_US: Response format
  type: string
  required: false
  options:
  - text
  - json_object
  - json_schema
  help:
    en_US: Ask for plain text, any valid JSON object, or JSON that follows a schema.
- name: json_schema
  use_template: json_schema
