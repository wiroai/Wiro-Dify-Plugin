model: google/gemini-2-5-flash
label:
  en_US: google/gemini-2-5-flash
model_type: llm
features:
- tool-call
- multi-tool-call
- stream-tool-call
- agent-thought
- vision
- document
- structured-output
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
- name: temperature
  use_template: temperature
  max: 2.0
- name: top_p
  use_template: top_p
- name: max_tokens
  use_template: max_tokens
  default: 8192
  min: 1
  max: 65536
- name: response_format
  label:
    en_US: Response format
  type: string
  required: false
  options:
  - text
  - json_schema
  help:
    en_US: Ask for plain text, any valid JSON object, or JSON that follows a schema.
- name: json_schema
  use_template: json_schema
pricing:
  input: '0.3'
  output: '2.5'
  unit: '0.000001'
  currency: USD
