model: moonshot/kimi-k3-1-pro
label:
  en_US: moonshot/kimi-k3-1-pro
model_type: llm
features:
- tool-call
- multi-tool-call
- stream-tool-call
- agent-thought
- vision
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
- name: max_tokens
  use_template: max_tokens
  default: 8192
  min: 1
  max: 1048576
- name: reasoning_effort
  label:
    en_US: Reasoning effort
  type: string
  required: false
  options:
  - low
  - medium
  - high
  help:
    en_US: How much the model thinks before it answers. Lower is faster and uses fewer
      tokens.
pricing:
  input: '2'
  output: '10'
  unit: '0.000001'
  currency: USD
