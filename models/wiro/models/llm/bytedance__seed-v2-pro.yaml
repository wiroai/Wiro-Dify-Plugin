model: bytedance/seed-v2-pro
label:
  en_US: bytedance/seed-v2-pro
model_type: llm
features:
- tool-call
- multi-tool-call
- stream-tool-call
- agent-thought
- vision
- document
model_properties:
  mode: chat
  context_size: 256000
parameter_rules:
- name: temperature
  use_template: temperature
  max: 2.0
- name: top_p
  use_template: top_p
- name: presence_penalty
  use_template: presence_penalty
- name: frequency_penalty
  use_template: frequency_penalty
- name: max_tokens
  use_template: max_tokens
  default: 8192
  min: 1
  max: 65536
- name: reasoning_effort
  label:
    en_US: Reasoning effort
  type: string
  required: false
  options:
  - low
  - medium
  - high
  help:
    en_US: How much the model thinks before it answers. Lower is faster and uses fewer
      tokens.
pricing:
  input: '0.5'
  output: '3'
  unit: '0.000001'
  currency: USD
