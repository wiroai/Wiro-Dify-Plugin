model: deepseek/v4-1-flash-economy
label:
  en_US: deepseek/v4-1-flash-economy
model_type: llm
features:
- tool-call
- multi-tool-call
- stream-tool-call
- agent-thought
- vision
- structured-output
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
- name: temperature
  use_template: temperature
  max: 2.0
- name: top_p
  use_template: top_p
- name: presence_penalty
  use_template: presence_penalty
- name: frequency_penalty
  use_template: frequency_penalty
- name: max_tokens
  use_template: max_tokens
  default: 8192
  min: 1
  max: 384000
- name: reasoning_effort
  label:
    en_US: Reasoning effort
  type: string
  required: false
  options:
  - low
  - medium
  - high
  help:
    en_US: How much the model thinks before it answers. Lower is faster and uses fewer
      tokens.
- name: response_format
  label:
    en_US: Response format
  type: string
  required: false
  options:
  - text
  - json_object
  - json_schema
  help:
    en_US: Ask for plain text, any valid JSON object, or JSON that follows a schema.
- name: json_schema
  use_template: json_schema
pricing:
  input: '0.24'
  output: '0.96'
  unit: '0.000001'
  currency: USD
