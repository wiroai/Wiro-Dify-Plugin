model: google/gemini-4-carbon
label:
  en_US: google/gemini-4-carbon
model_type: llm
features:
- tool-call
- multi-tool-call
- stream-tool-call
- agent-thought
model_properties:
  mode: chat
  context_size: 128000
parameter_rules:
- name: max_tokens
  use_template: max_tokens
  default: 8192
  min: 1
  max: 65536
- name: reasoning_effort
  label:
    en_US: Reasoning effort
  type: string
  required: false
  options:
  - low
  - medium
  - high
  help:
    en_US: How much the model thinks before it answers. Lower is faster and uses fewer
      tokens.
