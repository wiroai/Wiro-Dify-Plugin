model: openai/gpt-6-1-terra
label:
  en_US: openai/gpt-6-1-terra
model_type: llm
features:
- tool-call
- multi-tool-call
- stream-tool-call
- agent-thought
- vision
model_properties:
  mode: chat
  context_size: 1050000
parameter_rules:
- name: max_tokens
  use_template: max_tokens
  default: 8192
  min: 1
  max: 128000
- name: reasoning_effort
  label:
    en_US: Reasoning effort
  type: string
  required: false
  options:
  - low
  - medium
  - high
  help:
    en_US: How much the model thinks before it answers. Lower is faster and uses fewer
      tokens.
- name: verbosity
  label:
    en_US: Verbosity
  type: string
  required: false
  options:
  - low
  - medium
  - high
  help:
    en_US: How long and detailed the answer should be.
pricing:
  input: '1'
  output: '5'
  unit: '0.000001'
  currency: USD
